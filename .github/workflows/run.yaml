name: Build Push Image Trigger CI

on:
  push:
    branches:
      - dev
      - deploy
  #workflow_dispatch:

jobs:
  sonar_check:
    uses: ./.github/workflows/sonar.yaml
    secrets: inherit

  build-push:
    needs: [sonar_check]
    runs-on: ubuntu-24.04-arm
    environment: dev  

    steps:
      - name: pull code
        uses: actions/checkout@v4

      - name: docker install
        uses: docker/setup-buildx-action@v3

      - name: login docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: docker build
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }} .
          docker push  ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}

