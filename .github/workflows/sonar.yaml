name: Sonar_Code_Check
on:
#  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Use the args parameter to pass or override sonar properties dynamically
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_ORG_KEY }}_${{ github.event.repository.name }}
            "-Dsonar.projectName=${{ github.event.repository.name }}""
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }}